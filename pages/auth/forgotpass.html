<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>SeDaP Health - Password Reset</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100..900&amp;display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#a6caf3",
                        "on-tertiary-container": "#f8fdff",
                        "on-background": "#191c1e",
                        "surface": "#f7f9fb",
                        "tertiary-fixed-dim": "#7bd3e5",
                        "primary-container": "#2771df",
                        "inverse-on-surface": "#eff1f3",
                        "primary-fixed": "#d8e2ff",
                        "outline-variant": "#c2c6d5",
                        "error-container": "#ffdad6",
                        "secondary": "#3d6185",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary": "#006673",
                        "secondary-container": "#b1d5ff",
                        "outline": "#727785",
                        "tertiary-container": "#148090",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "surface-tint": "#005ac1",
                        "on-surface": "#191c1e",
                        "on-secondary-container": "#395c80",
                        "surface-container": "#eceef0",
                        "primary": "#0058bd",
                        "tertiary-fixed": "#a1efff",
                        "secondary-fixed": "#d0e4ff",
                        "background": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "surface-container-high": "#e6e8ea",
                        "on-primary-container": "#fefcff",
                        "on-primary-fixed": "#001a41",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#adc6ff",
                        "on-tertiary-fixed-variant": "#004e59",
                        "on-secondary-fixed-variant": "#24496c",
                        "on-surface-variant": "#424753",
                        "inverse-primary": "#adc6ff",
                        "surface-dim": "#d8dadc",
                        "on-tertiary-fixed": "#001f25",
                        "surface-variant": "#e0e3e5",
                        "on-primary-fixed-variant": "#004494",
                        "on-secondary-fixed": "#001d35"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px",
                        "expressive": "2rem 4rem 2rem 4rem",
                    },
                    "spacing": {
                        "gutter": "16px",
                        "stack-md": "16px",
                        "margin-desktop": "32px",
                        "stack-lg": "24px",
                        "margin-mobile": "16px",
                        "margin-tablet": "24px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Roboto Flex"],
                        "display-lg": ["Roboto Flex"],
                        "headline-md": ["Roboto Flex"],
                        "title-lg": ["Roboto Flex"],
                        "label-sm": ["Roboto Flex"],
                        "body-md": ["Roboto Flex"],
                        "body-lg": ["Roboto Flex"],
                        "title-md": ["Roboto Flex"],
                        "label-lg": ["Roboto Flex"],
                        "display-md": ["Roboto Flex"],
                        "headline-lg": ["Roboto Flex"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "400" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "400" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "display-md": ["45px", { "lineHeight": "52px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body
    class="bg-background min-h-screen flex items-center justify-center font-body-lg text-on-surface antialiased overflow-hidden">
    <!-- Canvas 1920x1080 constraint container -->
    <div class="relative w-full max-w-[1920px] h-[1080px] flex items-center justify-center bg-background mx-auto">
        <!-- Abstract Background Elements for Material 3 Expressive feel -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none opacity-30">
            <div
                class="absolute -top-64 -left-64 w-[800px] h-[800px] bg-primary-fixed rounded-full blur-[120px] mix-blend-multiply">
            </div>
            <div
                class="absolute bottom-[-20%] right-[-10%] w-[1000px] h-[1000px] bg-tertiary-fixed rounded-full blur-[150px] mix-blend-multiply">
            </div>
        </div>
        <!-- Main Card Container -->
        <div
            class="relative z-10 w-full max-w-lg bg-surface-container-lowest rounded-expressive shadow-[0_8px_40px_rgba(26,28,30,0.08)] p-12 flex flex-col gap-8">
            <!-- Header & Brand -->
            <div class="flex flex-col items-center text-center gap-4">
                <div
                    class="w-16 h-16 bg-primary-container text-on-primary-container rounded-2xl flex items-center justify-center rotate-3 shadow-sm">
                    <span class="material-symbols-outlined filled text-4xl">vpn_key</span>
                </div>
                <div>
                    <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2 tracking-tight">Reset Password
                    </h1>
                    <p class="font-body-lg text-body-lg text-on-surface-variant">Follow the steps below to securely
                        reset your SeDaP Health credentials.</p>
                </div>
            </div>
            <!-- Step Indicators -->
            <div class="flex items-center justify-center gap-3 w-full">
                <div class="w-2.5 h-2.5 rounded-full bg-primary transition-all duration-300"></div>
                <div class="w-8 h-1 rounded-full bg-surface-variant"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-surface-variant transition-all duration-300"></div>
            </div>
            <!-- Form Container -->
            <div class="flex flex-col gap-6 relative">
                <!-- Step 1: Verification -->
                <div class="flex flex-col gap-5 z-20 bg-surface-container-lowest transition-all duration-500 transform translate-y-0 opacity-100"
                    id="step-1">
                    <div class="flex flex-col gap-1.5">
                        <label class="font-label-lg text-label-lg text-on-surface px-1">Username or Employee ID</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
                            <input
                                class="w-full h-14 pl-12 pr-4 bg-transparent border border-outline rounded-[32px] font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none"
                                placeholder="e.g. sedap-user-89" type="text">
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="font-label-lg text-label-lg text-on-surface px-1">Recovery Email</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
                            <input
                                class="w-full h-14 pl-12 pr-4 bg-transparent border border-outline rounded-[32px] font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none"
                                placeholder="name@sedaphealth.org" type="email">
                        </div>
                    </div>
                    <button
                        class="w-full h-14 mt-2 bg-secondary-container text-on-secondary-container hover:bg-secondary-fixed transition-colors rounded-[32px] font-label-lg text-label-lg flex items-center justify-center gap-2"
                        onclick="document.getElementById('step-1').classList.add('opacity-50', 'scale-[0.98]', 'pointer-events-none'); document.getElementById('step-2').classList.remove('opacity-40', 'scale-[0.98]', 'pointer-events-none');">
                        <span>Send Reset Code</span>
                        <span class="material-symbols-outlined text-lg">arrow_forward</span>
                    </button>
                </div>
                <!-- Divider / Spatial Separator -->
                <div class="relative py-4 flex items-center">
                    <div class="flex-grow border-t border-surface-variant"></div>
                    <span
                        class="flex-shrink-0 mx-4 text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider">Step
                        2</span>
                    <div class="flex-grow border-t border-surface-variant"></div>
                </div>
                <!-- Step 2: New Password (De-emphasized initially) -->
                <div class="flex flex-col gap-5 z-10 transition-all duration-500 transform opacity-40 scale-[0.98] pointer-events-none origin-top"
                    id="step-2">
                    <div class="flex flex-col gap-1.5">
                        <label class="font-label-lg text-label-lg text-on-surface px-1">New Password</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
                            <input
                                class="w-full h-14 pl-12 pr-12 bg-transparent border border-outline rounded-[32px] font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none"
                                placeholder="••••••••" type="password">
                            <span
                                class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer hover:text-primary transition-colors">visibility_off</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="font-label-lg text-label-lg text-on-surface px-1">Confirm New Password</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock_reset</span>
                            <input
                                class="w-full h-14 pl-12 pr-4 bg-transparent border border-outline rounded-[32px] font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none"
                                placeholder="••••••••" type="password">
                        </div>
                    </div>
                    <button
                        class="w-full h-14 mt-2 bg-primary text-on-primary hover:bg-surface-tint shadow-[0_4px_14px_0_rgba(0,88,189,0.39)] hover:shadow-[0_6px_20px_rgba(0,88,189,0.23)] hover:-translate-y-0.5 transition-all rounded-[32px] font-label-lg text-label-lg flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-lg">check_circle</span>
                        <span>Reset Password</span>
                    </button>
                </div>
            </div>
            <!-- Footer Link -->
            <div class="text-center mt-2">
                <a class="font-label-lg text-label-lg text-primary hover:text-surface-tint transition-colors flex items-center justify-center gap-1.5"
                    href="#">
                    <span class="material-symbols-outlined text-sm">arrow_back</span>
                    Return to Sign In
                </a>
            </div>
        </div>
    </div>
</body>

</html>
